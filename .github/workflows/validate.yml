name: Visual Foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_release.py
      - name: PowerShell entry point smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/remaster.ps1 --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI entry point failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: NFSUC-Visual-Foundation-0.2.0-${{ runner.os }}
          path: artifacts/NFSUC-Visual-Foundation-0.2.0.zip*
